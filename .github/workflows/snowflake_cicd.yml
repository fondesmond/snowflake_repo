name: Snowflake CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
      SNOWFLAKE_CONNECTIONS_DEFAULT_USER: ${{ secrets.SF_USER }}
      SNOWFLAKE_CONNECTIONS_DEFAULT_PASSWORD: ${{ secrets.SF_PASSWORD }}
      SNOWFLAKE_CONNECTIONS_DEFAULT_ROLE: "ACCOUNTADMIN"
      SNOWFLAKE_CONNECTIONS_DEFAULT_WAREHOUSE: "SNOWFLAKE_LEARNING_WH"
      SNOWFLAKE_CONNECTIONS_DEFAULT_DATABASE: "DE_TUTORIAL"
      SNOWFLAKE_CONNECTIONS_DEFAULT_SCHEMA: "RAW"
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: Snowflake-Labs/snowflake-cli-action@v1.5
        with:
          cli-version: "latest"

      - name: Execute Infrastructure Setup
        run: snow sql -f setup.sql

      - name: Build and Deploy Snowpark App
        run: |
          cd snowpark_demo
          snow snowpark build
          snow snowpark deploy
